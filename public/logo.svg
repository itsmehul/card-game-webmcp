<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="tableFelt" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0f5132" />
      <stop offset="70%" stop-color="#072b1a" />
      <stop offset="100%" stop-color="#03150d" />
    </radialGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Table Felt Chip / Icon Background -->
  <rect width="512" height="512" rx="100" fill="url(#tableFelt)"/>
  
  <!-- Subtle Outer Border / Stitch Ring -->
  <rect x="20" y="20" width="472" height="472" rx="84" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.6"/>
  <rect x="28" y="28" width="456" height="456" rx="76" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.1"/>

  <!-- Tilted Playing Cards -->
  <!-- Back / Left Card (Red Heart) -->
  <g transform="translate(195, 195) rotate(-14) translate(-195, -195)" filter="url(#dropShadow)">
    <rect x="135" y="105" width="120" height="175" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="147" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="20" fill="#dc2626">A</text>
    <!-- Heart Symbol -->
    <path d="M 195, 185 C 195, 160 170, 160 170, 180 C 170, 205 195, 222 195, 222 C 195, 222 220, 205 220, 180 C 220, 160 195, 160 195, 185 Z" fill="#dc2626"/>
  </g>

  <!-- Front / Right Card (Ace of Spades) -->
  <g transform="translate(305, 205) rotate(12) translate(-305, -205)" filter="url(#dropShadow)">
    <rect x="245" y="115" width="120" height="175" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="257" y="142" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="20" fill="#0f172a">A</text>
    <!-- Spade Symbol -->
    <path d="M 305, 175 C 295, 195 280, 205 292, 220 C 300, 228 303, 225 303, 232 L 298, 237 L 312, 237 L 307, 232 C 307, 225 310, 228 318, 220 C 330, 205 315, 195 305, 175 Z" fill="#0f172a"/>
  </g>

  <!-- Decorative Suit Badges (Bottom Accent) -->
  <g transform="translate(0, 310)">
    <circle cx="216" cy="0" r="14" fill="#1e293b" opacity="0.8"/>
    <circle cx="296" cy="0" r="14" fill="#1e293b" opacity="0.8"/>
    <!-- Diamond -->
    <path d="M 216, -7 L 222, 0 L 216, 7 L 210, 0 Z" fill="#ef4444"/>
    <!-- Club -->
    <circle cx="296" cy="-4" r="3.2" fill="#38bdf8"/>
    <circle cx="292" cy="1" r="3.2" fill="#38bdf8"/>
    <circle cx="300" cy="1" r="3.2" fill="#38bdf8"/>
    <path d="M 295, 1 L 297, 1 L 298, 6 L 294, 6 Z" fill="#38bdf8"/>
  </g>

  <!-- App Title Typography -->
  <text x="256" y="380" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" letter-spacing="2" fill="#ffffff">
    CARD TABLE
  </text>
  <text x="256" y="415" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" letter-spacing="6" fill="url(#goldGradient)">
    LEARN PLAYING CARDS
  </text>
</svg>
