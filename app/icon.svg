<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="tableBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0e3d2a" />
      <stop offset="55%" stop-color="#082217" />
      <stop offset="100%" stop-color="#030d09" />
    </radialGradient>

    <!-- Metallic Gold Gradient for Borders & Typography -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>

    <!-- Neon Cyan Blueprint/Simulator Gradient -->
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Soft Depth Shadow for Overlapping Cards -->
    <filter id="softCardShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Glowing effect for Simulator Nodes -->
    <filter id="neonPulse" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Chip Rim Radial Pattern -->
    <pattern id="cardBackPattern" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#0f172a" />
      <path d="M 0 0 L 16 16 M 16 0 L 0 16" stroke="#1e293b" stroke-width="1.5" />
      <circle cx="8" cy="8" r="2.5" fill="#38bdf8" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="800" height="600" rx="36" fill="url(#tableBg)" />

  <!-- Subtle Outer Casino Edge Inlay -->
  <rect x="24" y="24" width="752" height="552" rx="24" fill="none" stroke="url(#goldSheen)" stroke-width="1.5" opacity="0.25" stroke-dasharray="6 6" />
  <rect x="34" y="34" width="732" height="532" rx="18" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.05" />

  <!-- Center Artwork: Composition of 3 Dynamic Playing Cards -->
  <!-- 1. LEFT CARD: Red Ace of Hearts (Classic Physical Card) -->
  <g transform="translate(325, 230) rotate(-16) translate(-325, -230)" filter="url(#softCardShadow)">
    <!-- Card Base -->
    <rect x="250" y="110" width="150" height="225" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Index -->
    <text x="264" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#dc2626">A</text>
    <path d="M 271, 150 C 271, 146 265, 144 263, 148 C 261, 144 255, 146 255, 150 C 255, 156 263, 161 263, 161 C 263, 161 271, 156 271, 150 Z" fill="#dc2626" />
    <!-- Center Heart Motif -->
    <path d="M 325, 202 C 325, 175 292, 173 292, 200 C 292, 228 325, 248 325, 248 C 325, 248 358, 228 358, 200 C 358, 173 325, 175 325, 202 Z" fill="#dc2626" />
  </g>

  <!-- 2. RIGHT CARD: Wireframe / Simulator / Code Card ("Create" Half) -->
  <g transform="translate(475, 230) rotate(16) translate(-475, -230)" filter="url(#softCardShadow)">
    <!-- Digital Glass Blueprint Base -->
    <rect x="400" y="110" width="150" height="225" rx="12" fill="#09141c" fill-opacity="0.9" stroke="url(#cyberGlow)" stroke-width="2" />
    <!-- Futuristic Grid Lines inside Card -->
    <line x1="400" y1="160" x2="550" y2="160" stroke="#06b6d4" stroke-width="0.8" opacity="0.3" stroke-dasharray="3 3" />
    <line x1="400" y1="210" x2="550" y2="210" stroke="#06b6d4" stroke-width="0.8" opacity="0.3" stroke-dasharray="3 3" />
    <line x1="400" y1="260" x2="550" y2="260" stroke="#06b6d4" stroke-width="0.8" opacity="0.3" stroke-dasharray="3 3" />
    <line x1="450" y1="110" x2="450" y2="335" stroke="#06b6d4" stroke-width="0.8" opacity="0.3" stroke-dasharray="3 3" />
    <line x1="500" y1="110" x2="500" y2="335" stroke="#06b6d4" stroke-width="0.8" opacity="0.3" stroke-dasharray="3 3" />
    
    <!-- Binary / Tech Code Indicator -->
    <text x="414" y="142" font-family="ui-monospace, monospace" font-size="20" font-weight="700" fill="#38bdf8">&lt;/&gt;</text>
    
    <!-- Central Geometric Diamond Node -->
    <polygon points="475,190 505,222 475,254 445,222" fill="none" stroke="url(#cyberGlow)" stroke-width="2.5" filter="url(#neonPulse)" />
    <circle cx="475" cy="190" r="3" fill="#67e8f9" />
    <circle cx="505" cy="222" r="3" fill="#67e8f9" />
    <circle cx="475" cy="254" r="3" fill="#67e8f9" />
    <circle cx="445" cy="222" r="3" fill="#67e8f9" />
    <circle cx="475" cy="222" r="5" fill="#38bdf8" />
  </g>

  <!-- 3. CENTER CARD: Master Ace of Spades (Anchoring Card) -->
  <g transform="translate(400, 215)" filter="url(#softCardShadow)">
    <!-- Card Slate -->
    <rect x="-80" y="-120" width="160" height="240" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <!-- Inner Fine Gold Trim -->
    <rect x="-72" y="-112" width="144" height="224" rx="10" fill="none" stroke="url(#goldSheen)" stroke-width="1.2" opacity="0.8" />
    
    <!-- Corner Pips -->
    <text x="-64" y="-86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" fill="#0f172a">A</text>
    <path d="M -59, -78 C -64, -68 -70, -64 -65, -57 C -61, -52 -57, -54 -57, -50 L -60, -47 L -54, -47 L -57, -50 C -57, -54 -53, -52 -49, -57 C -44, -64 -50, -68 -55, -78 Z" fill="#0f172a" />
    
    <!-- Hero Spade Insignia (Hybrid Gaming/Tech Emblem) -->
    <g transform="scale(1.35) translate(0, -6)">
      <!-- Main Spade Body -->
      <path d="M 0, -32 C -18, 0 -38, 12 -26, 26 C -18, 35 -6, 32 -6, 40 L -14, 46 L 14, 46 L 6, 40 C 6, 32 18, 35 26, 26 C 38, 12 18, 0 0, -32 Z" fill="#0f172a" />
      <!-- Golden Core Pulse Accent Inside Spade -->
      <path d="M 0, -18 C -9, 3 -18, 11 -12, 20 C -7, 26 -2, 23 0, 27 C 2, 23 7, 26 12, 20 C 18, 11 9, 3 0, -18 Z" fill="url(#goldSheen)" />
    </g>
  </g>

  <!-- Divider Ribbon / Floating Accent Bar -->
  <g transform="translate(400, 395)">
    <!-- Circuit Connection Nodes (Left: Organic Spades/Hearts, Right: Digital Logic) -->
    <line x1="-180" y1="0" x2="-30" y2="0" stroke="url(#goldSheen)" stroke-width="1.5" opacity="0.7" />
    <circle cx="-180" cy="0" r="3.5" fill="#eab308" />
    
    <!-- Mini Four Suits at Center Divider -->
    <g transform="translate(-16, -6) scale(0.7)">
      <!-- Spade -->
      <path d="M -24, 4 C -28, 9 -33, 11 -30, 15 C -28, 17 -26, 17 -26, 19 L -28, 21 L -22, 21 L -24, 19 C -24, 17 -22, 17 -20, 15 C -17, 11 -22, 9 -24, 4 Z" fill="#94a3b8" />
      <!-- Heart -->
      <path d="M -6, 8 C -6, 4 -11, 4 -12, 7 C -13, 4 -18, 4 -18, 8 C -18, 12 -12, 16 -12, 16 C -12, 16 -6, 12 -6, 8 Z" fill="#ef4444" />
      <!-- Club -->
      <path d="M 12, 7 C 10, 7 9, 9 9, 10 C 7, 9 5, 11 6, 13 C 7, 15 9, 15 11, 15 L 10, 19 L 14, 19 L 13, 15 C 15, 15 17, 15 18, 13 C 19, 11 17, 9 15, 10 C 15, 9 14, 7 12, 7 Z" fill="#94a3b8" />
      <!-- Diamond -->
      <polygon points="30,5 35,11 30,17 25,11" fill="#06b6d4" />
    </g>

    <line x1="30" y1="0" x2="180" y2="0" stroke="url(#cyberGlow)" stroke-width="1.5" opacity="0.7" />
    <circle cx="180" cy="0" r="3.5" fill="#38bdf8" />
  </g>

  <!-- Typography Section -->
  <!-- Main Title -->
  <text x="400" y="455" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#ffffff">
    PLAYING CARDS
  </text>
  <text x="400" y="495" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-weight="800" font-size="28" letter-spacing="8" fill="url(#goldSheen)">
    SIMULATOR
  </text>

  <!-- Tagline: "LEARN OR CREATE" -->
  <g transform="translate(400, 535)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="7">
      <tspan fill="#94a3b8">LEARN</tspan>
      <tspan fill="#eab308" dx="10">OR</tspan>
      <tspan fill="#38bdf8" dx="10">CREATE</tspan>
    </text>
  </g>
</svg>
